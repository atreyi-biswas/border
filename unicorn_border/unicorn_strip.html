<canvas id="uc" width="680" height="80" style="display:block;width:100%;border-radius:18px"></canvas>
<script>
(function(){
  var c = document.getElementById('uc');
  var ctx = c.getContext('2d');
  var W = 680, H = 80, CY = 40;
  var LWALL = 50, RWALL = 630;
  var x = LWALL, dir = 1, SPEED = 2.5;
  var trail = [], TRAIL_MAX = 45;
  var stars = [];
  var RAINBOW = ['#ff0000','#ff6600','#ffee00','#00cc44','#0088ff','#6600ff','#cc00ff'];

  for(var i=0;i<28;i++){
    stars.push({
      x: 10+Math.random()*660,
      y: 4+Math.random()*72,
      s: Math.random()<0.3?3:2,
      phase: Math.random()*Math.PI*2,
      col: ['#ffffff','#ffffcc','#ccffff','#ffccff','#aaaaff'][Math.floor(Math.random()*5)]
    });
  }

  function drawBg(){
    ctx.fillStyle='#08000f';
    if(ctx.roundRect){
      ctx.beginPath(); ctx.roundRect(0,0,W,H,18); ctx.fill();
    } else { ctx.fillRect(0,0,W,H); }

    ctx.fillStyle='#2a0848'; ctx.fillRect(0,0,12,12);
    ctx.fillStyle='#4a1278'; ctx.fillRect(12,0,8,8);
    ctx.fillStyle='#3a0a60'; ctx.fillRect(0,12,8,8);
    ctx.fillStyle='#081830'; ctx.fillRect(660,0,20,12);
    ctx.fillStyle='#1a0530'; ctx.fillRect(0,62,10,18);
    ctx.fillStyle='#050f28'; ctx.fillRect(660,62,20,18);

    var t = Date.now()/1000;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      ctx.globalAlpha=0.2+0.8*Math.abs(Math.sin(t*1.1+s.phase));
      ctx.fillStyle=s.col;
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }
    ctx.globalAlpha=1;

    ctx.strokeStyle='#5511aa'; ctx.lineWidth=2;
    ctx.strokeRect(1,1,678,78);

    var pulse=0.3+0.5*Math.abs(Math.sin(t*0.9));
    ctx.globalAlpha=pulse;
    ctx.strokeStyle='#9944ee'; ctx.lineWidth=2.5;
    ctx.strokeRect(1,1,678,78);
    ctx.globalAlpha=1;
  }

  function drawTrail(){
    for(var i=trail.length-1;i>=0;i--){
      var pt=trail[i];
      var age=i/trail.length;
      var alpha=(1-age)*0.9;
      var ci=Math.floor((1-age)*(RAINBOW.length-1));
      var w=Math.max(2,8*(1-age*0.55));
      for(var row=-3;row<=3;row++){
        ctx.globalAlpha=alpha*(1-Math.abs(row)*0.13);
        ctx.fillStyle=RAINBOW[Math.min(ci+Math.abs(row),RAINBOW.length-1)];
        ctx.fillRect(pt.x-w/2, pt.y+row*3.5, w, 2.5);
      }
    }
    ctx.globalAlpha=1;
  }

  function drawUnicorn(cx,cy,facing){
    ctx.save();
    ctx.translate(cx,cy);
    if(facing===-1) ctx.scale(-1,1);
    function r(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x,y,w,h); }
    r(-8,-5,14,8,'#f0d0ff');
    r(4,-8,5,5,'#eeddf8');
    r(6,-10,8,7,'#eeddf8');
    r(13,-17,2,2,'#ffe44a');
    r(13,-15,3,2,'#ffd700');
    r(12,-13,4,2,'#ffaa00');
    r(11,-7,2,2,'#220033');
    r(13,-5,1,1,'#dd88cc');
    r(5,-12,2,2,'#ff99dd');
    r(4,-11,2,5,'#ff44aa');
    r(3,-10,2,4,'#aa44ff');
    r(2,-9,2,3,'#ff99dd');
    r(-7,3,3,6,'#dda8f0');
    r(-3,3,3,6,'#dda8f0');
    r(1,3,3,6,'#dda8f0');
    r(5,3,3,6,'#dda8f0');
    r(-7,9,3,2,'#7733aa');
    r(-3,9,3,2,'#7733aa');
    r(1,9,3,2,'#7733aa');
    r(5,9,3,2,'#7733aa');
    var t=Date.now()/1000;
    if(Math.sin(t*4)>0){ r(16,-19,2,2,'#ffffff'); r(19,-14,2,2,'#ffd700'); }
    ctx.restore();
  }

  function loop(){
    drawBg();
    var tailOffX=dir===1?-10:10;
    trail.unshift({x:x+tailOffX,y:CY});
    if(trail.length>TRAIL_MAX) trail.pop();
    x+=SPEED*dir;
    if(x>=RWALL){x=RWALL;dir=-1;trail=[];}
    if(x<=LWALL){x=LWALL;dir=1;trail=[];}
    drawTrail();
    drawUnicorn(x,CY,dir);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pixelated galaxy border with animated unicorn and rainbow tail</title>
<desc>Animated border with pixelated unicorn traveling around the border, rainbow trail attached to its tail, galaxy and stars background.</desc>
<defs>
  <clipPath id="borderClip">
    <rect x="2" y="2" width="676" height="396" rx="18" ry="18"/>
  </clipPath>
  <style>
    .px-star { animation: twinkle 2s infinite alternate; }
    @keyframes twinkle { 0%{opacity:1} 100%{opacity:0.15} }
    .star-a{animation-delay:0s} .star-b{animation-delay:0.4s} .star-c{animation-delay:0.8s}
    .star-d{animation-delay:1.2s} .star-e{animation-delay:1.6s} .star-f{animation-delay:0.2s}
    .star-g{animation-delay:0.6s} .star-h{animation-delay:1.0s}
  </style>
  <path id="travelPath" d="
    M 340 12
    L 660 12
    Q 668 12 668 20
    L 668 380
    Q 668 388 660 388
    L 20 388
    Q 12 388 12 380
    L 12 20
    Q 12 12 20 12
    Z
  "/>
</defs>

<rect x="2" y="2" width="676" height="396" rx="18" ry="18" fill="#0a0014"/>

<g clip-path="url(#borderClip)">
  <rect x="60" y="30" width="8" height="8" fill="#2a0a4a" opacity="0.8"/>
  <rect x="68" y="30" width="8" height="8" fill="#3a1060" opacity="0.7"/>
  <rect x="76" y="30" width="8" height="8" fill="#2a0a4a" opacity="0.6"/>
  <rect x="60" y="38" width="8" height="8" fill="#3a1060" opacity="0.7"/>

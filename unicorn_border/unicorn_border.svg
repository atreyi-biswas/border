  <rect x="76" y="38" width="8" height="8" fill="#3a1060" opacity="0.8"/>
  <rect x="560" y="340" width="8" height="8" fill="#0a2a4a" opacity="0.8"/>
  <rect x="568" y="340" width="8" height="8" fill="#1a3a6a" opacity="0.9"/>
  <rect x="576" y="340" width="8" height="8" fill="#0a2a4a" opacity="0.7"/>
  <rect x="560" y="348" width="8" height="8" fill="#1a3a6a" opacity="0.8"/>
  <rect x="568" y="348" width="8" height="8" fill="#2a4a8a" opacity="0.9"/>

  <rect class="px-star star-a" x="30" y="20" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-b" x="100" y="15" width="4" height="4" fill="#ffffcc"/>
  <rect class="px-star star-c" x="180" y="22" width="2" height="2" fill="#ffffff"/>
  <rect class="px-star star-d" x="260" y="10" width="3" height="3" fill="#ccffff"/>
  <rect class="px-star star-e" x="340" y="18" width="2" height="2" fill="#ffffff"/>
  <rect class="px-star star-f" x="420" y="12" width="4" height="4" fill="#ffffaa"/>
  <rect class="px-star star-g" x="500" y="20" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-h" x="580" y="14" width="2" height="2" fill="#ccccff"/>
  <rect class="px-star star-a" x="640" y="25" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-c" x="25" y="80" width="2" height="2" fill="#ffffff"/>
  <rect class="px-star star-e" x="18" y="160" width="3" height="3" fill="#ffffcc"/>
  <rect class="px-star star-b" x="22" y="240" width="2" height="2" fill="#ffffff"/>
  <rect class="px-star star-f" x="16" y="320" width="4" height="4" fill="#aaffff"/>
  <rect class="px-star star-d" x="655" y="80" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-g" x="660" y="160" width="2" height="2" fill="#ffffcc"/>
  <rect class="px-star star-a" x="656" y="240" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-h" x="658" y="320" width="2" height="2" fill="#ffccff"/>
  <rect class="px-star star-e" x="40" y="375" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-c" x="120" y="382" width="2" height="2" fill="#ffffcc"/>
  <rect class="px-star star-f" x="200" y="378" width="4" height="4" fill="#ffffff"/>
  <rect class="px-star star-b" x="280" y="385" width="2" height="2" fill="#ccffff"/>
  <rect class="px-star star-a" x="360" y="380" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-g" x="440" y="376" width="2" height="2" fill="#ffffaa"/>
  <rect class="px-star star-d" x="520" y="383" width="3" height="3" fill="#ffffff"/>
  <rect class="px-star star-h" x="600" y="379" width="2" height="2" fill="#aaaaff"/>

  <rect x="4" y="4" width="672" height="392" rx="18" ry="18" fill="none" stroke="#6622cc" stroke-width="1.5" opacity="0.6"/>
  <rect x="6" y="6" width="668" height="388" rx="16" ry="16" fill="none" stroke="#aa44ee" stroke-width="0.5" opacity="0.4"/>

  <g>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#travelPath"/></animateMotion>

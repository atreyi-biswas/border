<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pixelated galaxy border with animated unicorn and rainbow tail</title>
<desc>Hollow animated border with transparent center, pixelated unicorn traveling around with rainbow tail, galaxy and stars.</desc>
<defs>
  <clipPath id="borderOnly">
    <path fill-rule="evenodd" d="
      M 0 0 L 680 0 L 680 400 L 0 400 Z
      M 40 40 L 640 40 L 640 360 L 40 360 Z
    "/>
  </clipPath>
  <style>
    .px-star { animation: twinkle 2s infinite alternate; }
    @keyframes twinkle { 0%{opacity:1} 100%{opacity:0.1} }
    .star-a{animation-delay:0s} .star-b{animation-delay:0.4s} .star-c{animation-delay:0.8s}
    .star-d{animation-delay:1.2s} .star-e{animation-delay:1.6s} .star-f{animation-delay:0.2s}
    .star-g{animation-delay:0.6s} .star-h{animation-delay:1.0s} .star-i{animation-delay:1.4s}
  </style>
  <path id="travelPath" d="
    M 340 20
    L 656 20
    Q 664 20 664 28
    L 664 372
    Q 664 380 656 380
    L 24 380
    Q 16 380 16 372
    L 16 28
    Q 16 20 24 20
    Z
  "/>
</defs>

<rect x="0" y="0" width="680" height="400" rx="18" ry="18" fill="#0a0014" clip-path="url(#borderOnly)"/>


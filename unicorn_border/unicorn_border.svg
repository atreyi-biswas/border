    <rect x="-18" y="-1" width="7" height="3" rx="1" fill="#0088ff" opacity="0.95"/>
    <rect x="-18" y="2" width="7" height="3" rx="1" fill="#00cc44" opacity="0.95"/>
    <rect x="-26" y="-6" width="9" height="3" rx="1" fill="#9900ff" opacity="0.85"/>
    <rect x="-26" y="-3" width="9" height="3" rx="1" fill="#0088ff" opacity="0.85"/>
    <rect x="-26" y="0" width="9" height="3" rx="1" fill="#00cc44" opacity="0.85"/>
    <rect x="-26" y="3" width="9" height="3" rx="1" fill="#ffee00" opacity="0.85"/>
    <rect x="-36" y="-8" width="11" height="3" rx="1" fill="#9900ff" opacity="0.7"/>
    <rect x="-36" y="-5" width="11" height="3" rx="1" fill="#0088ff" opacity="0.7"/>
    <rect x="-36" y="-2" width="11" height="3" rx="1" fill="#00cc44" opacity="0.7"/>
    <rect x="-36" y="1" width="11" height="3" rx="1" fill="#ffee00" opacity="0.7"/>
    <rect x="-36" y="4" width="11" height="3" rx="1" fill="#ff7700" opacity="0.7"/>
    <rect x="-48" y="-10" width="13" height="3" rx="1" fill="#9900ff" opacity="0.5"/>
    <rect x="-48" y="-7" width="13" height="3" rx="1" fill="#0088ff" opacity="0.5"/>
    <rect x="-48" y="-4" width="13" height="3" rx="1" fill="#00cc44" opacity="0.5"/>
    <rect x="-48" y="-1" width="13" height="3" rx="1" fill="#ffee00" opacity="0.5"/>
    <rect x="-48" y="2" width="13" height="3" rx="1" fill="#ff7700" opacity="0.5"/>
    <rect x="-48" y="5" width="13" height="3" rx="1" fill="#ff0000" opacity="0.5"/>
    <rect x="-62" y="-8" width="15" height="3" rx="1" fill="#0088ff" opacity="0.25"/>
    <rect x="-62" y="-5" width="15" height="3" rx="1" fill="#00cc44" opacity="0.25"/>
    <rect x="-62" y="-2" width="15" height="3" rx="1" fill="#ffee00" opacity="0.25"/>
    <rect x="-62" y="1" width="15" height="3" rx="1" fill="#ff7700" opacity="0.25"/>
    <rect x="-62" y="4" width="15" height="3" rx="1" fill="#ff0000" opacity="0.25"/>
  </g>

  <g>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#travelPath"/></animateMotion>
    <rect x="-8" y="-5" width="14" height="8" fill="#f0d0ff"/>
    <rect x="4" y="-8" width="5" height="5" fill="#f0d0ff"/>
    <rect x="6" y="-10" width="8" height="7" fill="#f0d0ff"/>
    <rect x="13" y="-16" width="2" height="2" fill="#ffd700"/>
    <rect x="13" y="-14" width="3" height="2" fill="#ffd700"/>
    <rect x="12" y="-12" width="4" height="2" fill="#ffaa00"/>
    <rect x="11" y="-7" width="2" height="2" fill="#220044"/>
    <rect x="13" y="-5" width="1" height="1" fill="#cc88cc"/>
    <rect x="5" y="-12" width="2" height="2" fill="#ff88cc"/>
    <rect x="4" y="-10" width="2" height="4" fill="#ff44aa"/>
    <rect x="3" y="-9" width="2" height="3" fill="#aa44ff"/>
    <rect x="2" y="-8" width="2" height="2" fill="#ff88cc"/>
    <rect x="-7" y="3" width="3" height="5" fill="#e0b0f0"/>
    <rect x="-3" y="3" width="3" height="5" fill="#e0b0f0"/>
    <rect x="1" y="3" width="3" height="5" fill="#e0b0f0"/>
    <rect x="5" y="3" width="3" height="5" fill="#e0b0f0"/>
    <rect x="-7" y="8" width="3" height="2" fill="#8844aa"/>
    <rect x="-3" y="8" width="3" height="2" fill="#8844aa"/>
    <rect x="1" y="8" width="3" height="2" fill="#8844aa"/>
    <rect x="5" y="8" width="3" height="2" fill="#8844aa"/>
    <rect x="16" y="-18" width="2" height="2" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="19" y="-13" width="2" height="2" fill="#ffd700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<rect x="1" y="1" width="678" height="398" rx="19" ry="19" fill="none" stroke="#7733bb" stroke-width="2">
  <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
</rect>
</svg>

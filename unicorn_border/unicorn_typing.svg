<script><![CDATA[
(function(){
  const FULL  = "Hi \u{1F44B}, I'm Atreyi Biswas";
  const CHARS = [...FULL];
  const N     = CHARS.length;
  const CYCLE = 16000;
  const HALF  = CYCLE / 2;
  const CHAR_INTERVAL = 1200 / N;
  const BS_INTERVAL   = 1200 / N;

  const elText = document.getElementById('typed');
  const elCur  = document.getElementById('cur');

  let shown = 0, lastDir = null, lastCycleTime = null, startTime = null;

  function render() {
    elText.textContent = CHARS.slice(0, shown).join('');
    elCur.setAttribute('opacity', shown > 0 ? '1' : '0');
    try {
      const bb = elText.getBBox();
      elCur.setAttribute('x', (340 + bb.width / 2 + 2).toString());
    } catch(e) {}
  }

  function tick(ts) {
    if (!startTime) startTime = ts;
    const elapsed = (ts - startTime) % CYCLE;
    const dir = elapsed < HALF ? 1 : -1;

    if (dir !== lastDir) {
      lastDir = dir;
      lastCycleTime = ts;
      shown = dir === 1 ? 0 : N;
    }

    const phaseMs = ts - (lastCycleTime || ts);
    const target = dir === 1
      ? Math.min(N, Math.floor(phaseMs / CHAR_INTERVAL))
      : Math.max(0, N - Math.floor(phaseMs / BS_INTERVAL));

    if (target !== shown) { shown = target; render(); }
    requestAnimationFrame(tick);
  }

  render();
  requestAnimationFrame(tick);
})();
]]></script>
</svg>
